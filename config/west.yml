manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Reinmuth66
      url-base: https://github.com/Reinmuth66
    - name: zettaface
      url-base: https://github.com/zettaface
    - name: caksoylar  # <-- led
      url-base: https://github.com/caksoylar
    - name: hsgw
      url-base: https://github.com/hsgw
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver  # <-- トラボドライバ
      remote: Reinmuth66
      revision: main
    - name: zmk-input-processor-keybind
      remote: zettaface
      revision: main
    - name: zmk-input-transform-processors
      remote: zmkfirmware
      revision: main
    - name: zmk-rgbled-widget  # <-- led
      remote: caksoylar
      revision: main
      # https://github.com/hsgw/zmk-feature-sensor_rotation
    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main
      path: modules/zmk-feature-sensor_rotation
  self:
    path: config
